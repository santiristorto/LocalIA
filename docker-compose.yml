# LocalIA — Docker Compose de DESARROLLO únicamente.
# DevOps & Deployment Specification §1.2: staging y producción se despliegan
# en Render/Vercel, no con este archivo. Postgres/Auth/Storage no se levantan
# acá — se usan con `supabase start` (Supabase CLI), como ya está decidido.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    ports:
      - "4000:4000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web

volumes:
  redis-data:
